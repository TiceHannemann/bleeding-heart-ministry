# Kingdom of The Bleeding Heart — run with `docker compose up -d --build`.
# The site is open to everyone. To put the ministries behind a password, add MINISTRY_PASSWORD under environment.
services:
  bh-ministry:
    # builds straight from GitHub, so this file works on its own (e.g. Hostinger Docker Manager "import from URL")
    build: https://github.com/TiceHannemann/bleeding-heart-ministry.git#main
    # rebuild from GitHub on every deploy, instead of reusing the image built last time
    pull_policy: build
    container_name: bh-ministry
    restart: unless-stopped
    ports:
      - "8080:8080"   # change the first number if Hermes already uses 8080
    environment:
      # lets a password sign-in work over plain http; remove once the site has HTTPS
      INSECURE_COOKIE: "1"
      # open-channel signals: Claude reads uploaded Discord chat each hour (leave empty to collect without analysing)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # the password your upload script sends with chat exports (any long random string)
      CHAT_UPLOAD_TOKEN: ${CHAT_UPLOAD_TOKEN:-}
      # an EarthMC API key (in game: /api key create) adds Rankings, the new-day scan and, with your player name, the Ledger.
      # Keep the key itself out of this file: put it in /root/bh.env on the server (see server/DEPLOY.md)
      EMC_KEY: ${EMC_KEY:-}
      EMC_PLAYER: ${EMC_PLAYER:-}
    volumes:
      - bh_data:/data
    mem_limit: 1500m
volumes:
  bh_data:
