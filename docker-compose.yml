# Kingdom of The Bleeding Heart — run with `docker compose up -d --build`.
# Set MINISTRY_PASSWORD in the environment (Docker Manager's variables, or a .env file beside this one).
services:
  bh-ministry:
    # builds straight from GitHub, so this file works on its own (e.g. Hostinger Docker Manager "import from URL")
    build: https://github.com/TiceHannemann/bleeding-heart-ministry.git#main
    container_name: bh-ministry
    restart: unless-stopped
    ports:
      - "8080:8080"   # change the first number if Hermes already uses 8080
    environment:
      MINISTRY_PASSWORD: ${MINISTRY_PASSWORD:?set MINISTRY_PASSWORD in .env}
      # plain http until a domain with HTTPS is set up; remove this line after that
      INSECURE_COOKIE: "1"
    volumes:
      - bh_data:/data
    mem_limit: 1500m
volumes:
  bh_data:
