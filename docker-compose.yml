# Kingdom of The Bleeding Heart — run with `docker compose up -d --build` from this folder.
# Put the password in a file named .env beside this one:  MINISTRY_PASSWORD=your-password
services:
  bh-ministry:
    build: .
    container_name: bh-ministry
    restart: unless-stopped
    ports:
      - "8080:8080"   # change the first number if Hermes already uses 8080
    environment:
      MINISTRY_PASSWORD: ${MINISTRY_PASSWORD:?set MINISTRY_PASSWORD in .env}
      # plain http until a domain with HTTPS is set up; remove this line after that
      INSECURE_COOKIE: "1"
    volumes:
      - bh_data:/data
    mem_limit: 1500m
volumes:
  bh_data:
