# Fly.io: one always-on machine with a volume for the archive. Deploy with `fly deploy`.
app = "bleeding-heart-ministry"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  PORT = "8080"

[mounts]
  source = "bh_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # keep it running: the hourly scan needs the machine awake
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "60s"
    timeout = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
